appId: com.laststance.engage
tags:
  - ios
---
# QA-13: A routine switch persists only after saving the preset editor.
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "calendar-screen"
    timeout: 10000
- tapOn:
    id: "today-tab"
- tapOn:
    id: "task-selection-button"
- tapOn:
    id: "edit-presets-button"
- extendedWaitUntil:
    visible:
      id: "task-daily-auto-add-switch-0"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "task-daily-auto-add-switch-0"
      checked: false
    timeout: 15000
- tapOn:
    id: "task-daily-auto-add-switch-0"
- extendedWaitUntil:
    visible:
      id: "task-daily-auto-add-switch-0"
      checked: true
    timeout: 15000
- tapOn:
    id: "preset-editor-save"
- extendedWaitUntil:
    notVisible:
      id: "preset-editor-close"
    timeout: 10000

# A cold launch retains the saved routine setting.
- launchApp:
    stopApp: true
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "calendar-screen"
    timeout: 10000
- tapOn:
    id: "today-tab"
- tapOn:
    id: "task-selection-button"
- tapOn:
    id: "edit-presets-button"
- extendedWaitUntil:
    visible:
      id: "task-daily-auto-add-switch-0"
      checked: true
    timeout: 15000

# Discarding an OFF draft must leave the saved routine enabled.
- tapOn:
    id: "task-daily-auto-add-switch-0"
- tapOn:
    id: "preset-editor-close"
- tapOn: "Discard"
- extendedWaitUntil:
    notVisible:
      id: "preset-editor-close"
    timeout: 10000
- tapOn:
    id: "task-selection-button"
- tapOn:
    id: "edit-presets-button"
- extendedWaitUntil:
    visible:
      id: "task-daily-auto-add-switch-0"
      checked: true
    timeout: 15000

# Saving OFF survives another cold launch.
- tapOn:
    id: "task-daily-auto-add-switch-0"
- tapOn:
    id: "preset-editor-save"
- extendedWaitUntil:
    notVisible:
      id: "preset-editor-close"
    timeout: 10000
- launchApp:
    stopApp: true
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "calendar-screen"
    timeout: 10000
- tapOn:
    id: "today-tab"
- tapOn:
    id: "task-selection-button"
- tapOn:
    id: "edit-presets-button"
- extendedWaitUntil:
    visible:
      id: "task-daily-auto-add-switch-0"
      checked: false
    timeout: 15000
