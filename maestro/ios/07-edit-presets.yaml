appId: com.laststance.engage
tags:
  - ios
---
# QA-07: Edit Presets
# Verifies Edit Presets button opens PresetTaskEditor with expected elements

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "calendar-screen"
    timeout: 10000

# Navigate to Today tab
- tapOn: "today-tab"

- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 5000

# Open TaskPicker
- tapOn:
    id: "task-selection-button"

- extendedWaitUntil:
    visible:
      id: "edit-presets-button"
    timeout: 5000

# Tap Edit Presets
- tapOn:
    id: "edit-presets-button"

- extendedWaitUntil:
    visible:
      text: "Edit Preset Tasks"
    timeout: 5000

# Verify PresetTaskEditor elements
- assertVisible:
    id: "add-task-button"
- assertVisible:
    id: "preset-editor-close"

# Regression: Input proves the new row owns keyboard focus because RN 0.86 does
# not expose the native first-responder state through Maestro's focused flag.
- tapOn:
    id: "add-task-button"

- extendedWaitUntil:
    visible:
      text: "Enter task name"
    timeout: 15000

- assertNotVisible:
    id: "preset-editor-inline-keyboard-done-button"

- inputText: "E2EStableTask"

- assertVisible:
    text: "E2EStableTask"

- assertNotVisible:
    id: "preset-editor-save"

# Regression: Changing category while editing should not move the active row
# out of the visible keyboard-safe area.
- tapOn:
    id: "latest-new-task-category-option-life"

- assertVisible:
    text: "E2EStableTask"

# Close PresetTaskEditor
- tapOn:
    id: "preset-editor-close"

# Handle discard dialog if it appears
- tapOn:
    text: "Discard"
    optional: true
- extendedWaitUntil:
    notVisible:
      id: "preset-editor-close"
    timeout: 10000
- assertNotVisible: "E2EStableTask"

# A new preset saved from Today's editor appears in the day's list immediately.
- tapOn:
    id: "task-selection-button"
- tapOn:
    id: "edit-presets-button"
- tapOn:
    id: "add-task-button"
- extendedWaitUntil:
    visible: "Enter task name"
    timeout: 15000
- inputText: "E2ETodayHabit"
- tapOn: "Done"
- scrollUntilVisible:
    element:
      id: "task-add-to-today-switch-.*"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "task-add-to-today-switch-.*"
    checked: true
- tapOn:
    id: "preset-editor-save"
- extendedWaitUntil:
    visible:
      text: "E2ETodayHabit"
    timeout: 15000
- extendedWaitUntil:
    visible: "0/1"
    timeout: 15000
- tapOn:
    id: "task-item-.*"
- extendedWaitUntil:
    visible: "1/1"
    timeout: 15000
