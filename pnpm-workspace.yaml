legacyPeerDeps: true

# Supply-chain security (migrated from .npmrc 2026-05-07)
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - next
  - react
  - react-dom
  - '@types/react'
  - '@types/react-dom'
  - typescript
  - vite
  - vitest
  - '@vitejs/plugin-react'
  - eslint
  - prettier
  - tailwindcss
  - '@tanstack/react-query'
  - zod
  - react-hook-form
  - eslint-config-ts-prefixer
  - '@laststance/redux-storage-middleware'
  - '@laststance/react-next-eslint-plugin'
allowBuilds:
  fallow: true
  unrs-resolver: true

overrides:
  "fallow@3.18.0>fallow-type-aware": "-"
  "@babel/core@<7.29.1": 7.29.7
  "@xmldom/xmldom@>=0.7.0 <0.8.15": 0.8.15
  "brace-expansion@<1.1.18": 1.1.18
  "brace-expansion@>=2.0.0 <2.1.4": 2.1.4
  "brace-expansion@>=4.0.0 <5.0.6": 5.0.6
  # The local 0.5.0 patch retains query-string's CommonJS decoder contract.
  "decode-uri-component@<0.5.0": 0.5.0
  electron-to-chromium: 1.5.413
  "flatted@<=3.4.1": 3.4.2
  "js-yaml@<4.3.1": 4.3.1
  "minimatch@<3.1.4": 3.1.4
  "minimatch@>=8.0.0 <8.0.6": 8.0.6
  "minimatch@>=9.0.0 <9.0.7": 9.0.7
  "node-forge@<1.4.0": 1.4.0
  "picomatch@<2.3.2": 2.3.2
  "picomatch@>=4.0.0 <4.0.4": 4.0.4
  "postcss@<8.5.23": 8.5.23
  shell-quote: 1.10.0
  "uuid@<11.1.1": 11.1.1
  "ws@>=7.0.0 <7.5.11": 7.5.11
  "ws@>=8.0.0 <8.21.0": 8.21.0
  "yaml@>=2.0.0 <2.8.3": 2.8.4
peerDependencyRules:
  allowedVersions:
    "fdir@6.5.0>picomatch": 4.0.7
patchedDependencies:
  decode-uri-component@0.5.0: patches/decode-uri-component@0.5.0.patch
  react-native-css-interop@0.2.6: patches/react-native-css-interop@0.2.6.patch
verifyStoreIntegrity: true
