# Supply-chain security (migrated from .npmrc 2026-05-07)
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Approved Expo SDK 57 compatibility patches; keep future releases age-gated.
  - '@expo/metro-runtime@57.0.17'
  - expo@57.0.31
  - expo-build-properties@57.0.22
  - expo-constants@57.0.22
  - expo-linking@57.0.13
  - expo-notifications@57.0.24
  - expo-router@57.0.29
  - expo-sharing@57.0.24
  # Required transitive dependencies from the same Expo release.
  - '@expo/cli@57.0.32'
  - '@expo/config-plugins@57.0.11'
  - '@expo/router-server@57.0.14'
  - '@expo/ui@57.0.26'
  - expo-modules-core@57.0.24
  - expo-modules-jsi@57.1.3
  - next
  - react
  - react-dom
  - '@types/react'
  - '@types/react-dom'
  - typescript
  - vite
  - vitest
  - '@vitejs/plugin-react'
  - eslint
  - prettier
  - tailwindcss
  - '@tanstack/react-query'
  - zod
  - react-hook-form
  - eslint-config-ts-prefixer
  - '@laststance/redux-storage-middleware'
  - '@laststance/react-next-eslint-plugin'
allowBuilds:
  # Jest uses the published platform binary; do not build this optional watcher from source.
  '@parcel/watcher': false
  fallow: true
  unrs-resolver: true

overrides:
  # GHSA-3g3m-2fjr-6pw4: glob 9–14.0.1 keeps traversing after AbortSignal cancellation.
  "glob@>=9.0.0 <14.0.2": 14.0.2
  "@babel/core@<7.29.1": 7.29.7
  "@xmldom/xmldom@>=0.7.0 <0.8.15": 0.8.15
  "brace-expansion@<1.1.21": 1.1.21
  "brace-expansion@>=2.0.0 <2.1.7": 2.1.7
  "brace-expansion@>=3.0.0 <5.0.12": 5.0.12
  electron-to-chromium: 1.5.489
  "flatted@<=3.4.1": 3.4.2
  "js-yaml@<4.3.2": 4.3.2
  "minimatch@<3.1.4": 3.1.4
  # GHSA-g3hv-75wg-m249 affects the 7.x through 11.0.0 releases.
  "minimatch@>=7.0.0 <11.0.1": 11.0.9
  "node-forge@<1.4.0": 1.4.0
  "picomatch@<2.3.2": 2.3.2
  "picomatch@>=4.0.0 <4.0.4": 4.0.4
  "postcss@<8.5.23": 8.5.23
  "postcss-selector-parser@<7.1.6": 7.1.6
  shell-quote: 1.12.0
  "ws@>=7.0.0 <7.5.11": 7.5.11
  "ws@>=8.0.0 <8.21.0": 8.21.0
  "yaml@>=2.0.0 <2.8.3": 2.8.4
peerDependencyRules:
  allowedVersions:
    "fdir@6.5.0>picomatch": 4.0.7
patchedDependencies:
  react-native-css-interop@0.2.7: patches/react-native-css-interop@0.2.7.patch
verifyStoreIntegrity: true
